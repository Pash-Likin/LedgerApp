name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号标签（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Release 标题（留空自动生成）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_RELEASE_TITLE: ${{ github.event.inputs.release_title }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME="${INPUT_TAG_NAME:-v1.0.0}"
          fi
          SAFE_TAG=$(printf '%s' "$TAG_NAME" | tr -cd 'A-Za-z0-9._-')
          if [ -z "$SAFE_TAG" ]; then
            SAFE_TAG="v1.0.0"
          fi
          if [ -n "$INPUT_RELEASE_TITLE" ]; then
            RELEASE_TITLE="$INPUT_RELEASE_TITLE"
          else
            RELEASE_TITLE="轻记账 ${TAG_NAME}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          test -d "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Prebuild Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Package release APK
        env:
          SAFE_TAG: ${{ steps.meta.outputs.safe_tag }}
        run: |
          mkdir -p release
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          cp "$APK_PATH" "release/QingJiZhang-${SAFE_TAG}.apk"
          ls -lh "release/QingJiZhang-${SAFE_TAG}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingJiZhang-${{ steps.meta.outputs.safe_tag }}-apk
          path: release/QingJiZhang-${{ steps.meta.outputs.safe_tag }}.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          SAFE_TAG: ${{ steps.meta.outputs.safe_tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
        run: |
          APK_FILE="release/QingJiZhang-${SAFE_TAG}.apk"
          test -s "$APK_FILE"
          cat << 'EOF' > release/RELEASE_NOTES.md
          ### 安装与使用说明

          1. 点击下方 Assets 中的 **`.apk`** 文件下载到安卓手机并安装（首次安装自建应用需在系统弹窗中允许「未知来源应用」）。
          2. 如需启用**微信 / 支付宝 / 美团实时自动记账**：
             - 打开「轻记账」→ 点击首页右上角铃铛图标（或「分类 → 自动记账与桌面小组件」）；
             - 依次开启「弹出确认通知权限」、「通知栏使用权」以及可选的「无障碍服务」；
             - 可点击页面内的「模拟美团外卖 ¥36.50」立即测试通知栏弹窗确认效果。
          3. 如需使用**手机桌面小组件**：点击同一页面底部的「一键添加到手机桌面」，或在手机桌面长按空白处添加「轻记账 · 月度概览」。
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" "$APK_FILE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release/RELEASE_NOTES.md
          fi
